# Copy to config.ini and fill in from Nextiva:
#   NextOS portal -> Voice & Analytics -> Users -> Manage Users -> (user) -> Device
#   Available Devices: "Generic SIP Phone"
#   The Device tab shows: SIP Username, Domain, Authentication Name, Password.

[app]
mode = phone                       ; phone    = register the SIP line: calls, voice, Team view
                                   ; presence = Team view only: nothing registers, nothing can be called

[update]
source =                           ; optional: folder / network share with sipphone-*.whl files, or an
                                   ; https:// address of a latest.json; checked at start and every 6 h
auto   = false                     ; install a found update by itself when no call is active

[account]
username      = 1234567890          ; Nextiva "SIP Username" (often the 10-digit DID or user@domain's user part)
auth_username = 1234567890_abc      ; Nextiva "Authentication Name" (leave blank if same as username)
password      = YOUR_SIP_PASSWORD   ; Nextiva SIP "Password" (NOT your portal login)
domain        = nextiva.com         ; Nextiva "Domain" shown on the Device tab (e.g. nextiva.com / ro3.nextiva.com)
proxy         =                     ; outbound proxy host; leave blank to use the domain
proxy_port    = 5060                ; Nextiva: UDP/TCP 5060
display_name  = My Desk

[local]
bind_ip          = 0.0.0.0
bind_port        = 5060            ; local SIP listen port (set 5062 etc. if 5060 is in use)
public_ip        =                 ; force the IP advertised in Contact/SDP (usually leave blank; learned via rport)
rtp_ports        = 10000-20000     ; forward/allow this UDP range on your firewall for audio
register_expires = 3600
keepalive_seconds = 25
codecs           = PCMU,PCMA       ; Nextiva supports G.711 u-law/A-law

[audio]
backend = auto                     ; auto | sounddevice | file | null
input_device  =                    ; name or index from `python -m sipphone --devices`
output_device =
play_file   =                      ; backend=file: 8 kHz mono 16-bit WAV to play to the far end
record_file =                      ; backend=file: record far end audio here

[tts]
engine   =                         ; piper | espeak | openai | elevenlabs  (blank = off; or use --tts)
model    =                         ; piper: path to voice .onnx (default en_US-lessac-medium.onnx); openai: model name
voice    =                         ; espeak voice (en-us) / openai voice (alloy)
mode     = duck                    ; with a real mic: duck = TTS replaces mic while speaking, mix = both
gain     = 0.9
greeting =                         ; optional text spoken automatically when a call connects

[stt]
engine =                           ; whisper | vosk  (blank = off; or use --stt). Shows what the caller says as text.
model  =                           ; whisper: tiny.en | base.en (default) | small.en ; vosk: path to model folder

[presence]
; Team view source.  events = your own user login over XSI Events (live, includes Do Not Disturb;
;                             everyone in the company directory the phone system lets you watch)
;                    admin  = an Admin XSI login ([admin] below), same live engine
;                    off    = no Team view.  Blank = admin if [admin] has a login.
mode         =
xsi_user     =                     ; YOUR OWN user ID (e.g. jdoe1234567@example.com)
xsi_password =                     ; that user's password

[admin]
; Settings shared by both Team view sources: xsi_host, user_domain, hide_user, pickup_code.
; The rest is only for mode = admin.
; Supervisor/admin view of other users on your BroadWorks/Nextiva group:
; see who is on a call and who they are speaking with (read-only).
; Uses the Xsi-Actions REST API with admin or supervisor credentials over HTTPS.
xsi_host     = https://xsi.nextiva.com ; Nextiva Xsi base URL (host only)
username     =                     ; admin/supervisor user ID (not your SIP line) — blank disables the Team view
password     =                     ; that account's password
users          =                   ; specific userIds to watch, e.g. jsmith1234567@nextiva.com, mjones7654321@nextiva.com
                                   ; leave blank to auto-discover the whole group (needs directory_user below)
directory_user =                   ; a real user, e.g. jdoe1234567, whose directory lists everyone
                                   ; (used only when 'users' is blank; the admin login usually has no directory)
directory_type = enterprise        ; enterprise (default, works on Nextiva) or group
user_domain    = nextiva.com       ; appended to bare directory userIds for status, e.g. jsmith1234567@nextiva.com
users_only     = true              ; filter the directory to users: hides hunt groups, paging, auto attendants, etc.
                                   ; (Call Parks are kept — they count as users). Set false to show every entry.
exclude        =                   ; optional: comma-separated name keywords to hide (overrides the built-in list).
                                   ; e.g. hunt group, group paging, auto attendant, call center, voice portal, route point
hide_user    =                     ; userId(s) or extension(s) to hide from the Team view, e.g. your own line (jdoe1234567 or 1005)
poll_seconds = 5                   ; how often to refresh call status
pickup_code  = *97                 ; Directed Call Pickup feature code (dialed + extension to answer a teammate's ringing call); confirm with Nextiva
verify_tls   = true                ; set false only if the Xsp uses a self-signed certificate

[extension]
store_id =                         ; the Chrome Web Store ID of the published extension (32 letters), if used
